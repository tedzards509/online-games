[workspace]
members = ["crates/arena-core", "crates/arena-server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
thiserror = "2"
utoipa = { version = "5", features = ["axum_extras"] }
