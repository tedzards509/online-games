services:
  backend:
    build:
      context: .
      dockerfile: crates/arena-server/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env to the browser origin}
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/arena.db}
      RUST_LOG: ${RUST_LOG:-arena_server=info,tower_http=info}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - arena-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"

volumes:
  arena-data:
